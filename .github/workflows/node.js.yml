name: VideoChat-BE CI/CD Pipeline (ECR + ECS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Cần thiết nếu dùng OIDC assume role vào AWS

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # --- 1. CHECKOUT CODE ---
      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1.1. SETUP MÔI TRƯỜNG NODE.JS ---
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --- 1.2. CÀI ĐẶT DEPENDENCIES ---
      - name: Install Dependencies
        run: npm ci

      # --- 1.3. CHẠY UNIT TEST (BẬT LẠI KHI CÓ TEST) ---
      # - name: Run Unit Tests
      #   run: npm test

      # --- 2. TÍNH SEMANTIC VERSION ---
      - name: Calculate Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE:|!:)"
          minor_pattern: "^feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true

      # --- 3. CẤU HÌNH AWS CREDENTIALS ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }} # Ví dụ: ap-southeast-1

      # --- 4. ĐĂNG NHẬP AMAZON ECR ---
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- 5. TẠO DOCKER BUILDX ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 6. BUILD LOCAL IMAGE ĐỂ SCAN LỖ HỔNG (DEVSECOPS) ---
      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: temp-scan-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 7. CHẠY TRIVY SCAN ---
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "temp-scan-image:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # --- 8. BUILD VÀ PUSH LÊN AMAZON ECR ---
      - name: Build, tag, and push Docker image to Amazon ECR
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY_NAME }}
          IMAGE_TAG: v${{ steps.semver.outputs.version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          
      # --- 9. TRIỂN KHAI (DEPLOY) LÊN AMAZON ECS ---
      - name: Deploy to Amazon ECS Service
        if: github.event_name != 'pull_request'
        run: |
          # 1. Tải task definition hiện tại trên ECS
          aws ecs describe-task-definition --task-definition ${{ secrets.ECS_TASK_DEFINITION_NAME }} --query taskDefinition > task-def.json

          # 2. Xử lý file JSON để loại bỏ các metadata không cần thiết khi update (như taskDefinitionArn, revision, status, v.v.)
          jq '. | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def.json > updated-task-def.json

          # 3. Cập nhật image mới vào container định nghĩa trong task definition (thay thế "videochat-be" bằng tên container trong ECS của bạn)
          # Lưu ý: Đảm bảo tên container khớp với tên container cấu hình trong ECS Task Definition
          NEW_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY_NAME }}:v${{ steps.semver.outputs.version }}"
          
          jq --arg IMAGE "$NEW_IMAGE" '.containerDefinitions[0].image = $IMAGE' updated-task-def.json > final-task-def.json

          # 4. Đăng ký Task Definition mới
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://final-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)

          # 5. Cập nhật ECS Service để sử dụng Task Definition mới và ép rollout (force-new-deployment)
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment

      # --- 10. BẤM GIT TAG CHO CODE APP ---
      - name: Create Git Tag on App Repo
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.semver.outputs.version }} || exit 0
          git push origin v${{ steps.semver.outputs.version }} || exit 0
